name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build:demo

      # GitHub Pages cannot redirect unknown URLs to index.html, but it does serve 404.html for them.
      # Copying index.html there lets the Angular router handle links like /appointments on refresh.
      - name: Make direct links work
        run: cp dist/whiskers-client/browser/index.html dist/whiskers-client/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist/whiskers-client/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
